---
# Офіційний спосіб встановлення Docker Engine на Ubuntu.

- name: Встановити залежності
  ansible.builtin.apt:
    name: [ca-certificates, curl]
    state: present

- name: Створити каталог для ключів apt
  ansible.builtin.file:
    path: /etc/apt/keyrings
    state: directory
    mode: "0755"

- name: Завантажити GPG-ключ Docker
  ansible.builtin.get_url:
    url: https://download.docker.com/linux/ubuntu/gpg
    dest: /etc/apt/keyrings/docker.asc
    mode: "0644"

- name: Додати репозиторій Docker
  ansible.builtin.apt_repository:
    repo: >-
      deb [arch={{ 'arm64' if ansible_architecture == 'aarch64' else 'amd64' }}
      signed-by=/etc/apt/keyrings/docker.asc]
      https://download.docker.com/linux/ubuntu {{ ansible_distribution_release }} stable
    filename: docker
    state: present

- name: Встановити Docker Engine і Compose
  ansible.builtin.apt:
    name:
      - docker-ce
      - docker-ce-cli
      - containerd.io
      - docker-buildx-plugin
      - docker-compose-plugin
    state: present
    update_cache: true

- name: Запустити Docker і додати в автозапуск
  ansible.builtin.service:
    name: docker
    state: started
    enabled: true

- name: Дозволити користувачу vagrant працювати з Docker без sudo
  ansible.builtin.user:
    name: vagrant
    groups: docker
    append: true
