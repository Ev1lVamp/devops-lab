---
- name: Оновити кеш apt
  ansible.builtin.apt:
    update_cache: true
    cache_valid_time: 3600

- name: Встановити базові пакети
  ansible.builtin.apt:
    name: "{{ common_packages }}"
    state: present

- name: Встановити часовий пояс
  community.general.timezone:
    name: "{{ timezone }}"

- name: Дозволити SSH у фаєрволі (до увімкнення ufw!)
  community.general.ufw:
    rule: allow
    name: OpenSSH

- name: Увімкнути фаєрвол ufw
  community.general.ufw:
    state: enabled
    policy: deny
